doctrine:
    dbal:
        default_connection: master
        connections:
            # DB centrale: utenti ROLE_ADMIN / ROLE_NOTARY, registro agenzie (Company) e indice login.
            master:
                url: '%env(resolve:DATABASE_URL)%'
                driver: 'pdo_mysql'
                charset: utf8mb4
                default_table_options:
                    charset: utf8mb4
                    collate: utf8mb4_unicode_ci
                profiling_collect_backtrace: '%kernel.debug%'
            # DB per-agenzia (ROLE_AGENCY). La connessione viene ri-puntata a runtime
            # al database della company corrente tramite App\Bundle\DynamicConnection.
            slave:
                url: '%env(resolve:DATABASE_SLAVE_URL)%'
                driver: 'pdo_mysql'
                charset: utf8mb4
                default_table_options:
                    charset: utf8mb4
                    collate: utf8mb4_unicode_ci
                wrapper_class: App\Bundle\DynamicConnection

    orm:
        default_entity_manager: master
        entity_managers:
            master:
                connection: master
                naming_strategy: doctrine.orm.naming_strategy.underscore
                validate_xml_mapping: true
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    Master:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Master'
                        prefix: 'App\Entity\Master'
                        alias: Master
            slave:
                connection: slave
                naming_strategy: doctrine.orm.naming_strategy.underscore
                validate_xml_mapping: true
                mappings:
                    Slave:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity/Slave'
                        prefix: 'App\Entity\Slave'
                        alias: Slave

when@test:
    doctrine:
        dbal:
            connections:
                master:
                    # "TEST_TOKEN" is typically set by ParaTest
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                slave:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
