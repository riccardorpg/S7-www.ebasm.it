# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:
    # --- Percorsi / branding ---
    path_graphics: 'images/graphics'
    web_path: 'public'

    # --- Email ---
    email_noreply: 'no-reply@ebasm.it'
    object_recovery: 'Recupero password'
    object_credentials: 'Credenziali di accesso'

    # --- Firewall /script (SQL runner) ---
    password_script: '%env(SCRIPT_PASSWORD)%'

    # --- IUBENDA (cookie/privacy/termini) — vuoti = disattivato, fallback pagine interne ---
    iubenda_site_id: '%env(IUBENDA_SITE_ID)%'
    iubenda_cookie_policy_id: '%env(IUBENDA_COOKIE_POLICY_ID)%'
    iubenda_privacy_policy_id: '%env(IUBENDA_PRIVACY_POLICY_ID)%'
    iubenda_terms_id: '%env(IUBENDA_TERMS_ID)%'

    # --- Multi-tenant: prefisso e coordinate del server che ospita i DB agenzia (slave) ---
    # Solo il NOME del database varia per agenzia (Company.dbName); host/port/user/password
    # sono condivisi e usati da DynamicConnection::changeDatabase().
    db_prefix: 'ebasm_'
    slave_database_host: '%env(SLAVE_DB_HOST)%'
    slave_database_port: '%env(SLAVE_DB_PORT)%'
    slave_database_user: '%env(SLAVE_DB_USER)%'
    slave_database_password: '%env(SLAVE_DB_PASSWORD)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Bundle/'
            - '../src/Kernel.php'

    # Ri-punta la connessione 'slave' al DB dell'agenzia corrente PRIMA del firewall
    # (priority 100 > firewall priority 8) così il user_provider entity 'slave' carica
    # lo User dal database giusto.
    App\EventListener\SlaveDatabaseSwitcherListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 100 }

    # Impersonazione tenant-aware: quando un ROLE_ADMIN impersona un'agenzia, ri-punta
    # lo slave al DB dell'agenzia impersonata.
    App\EventListener\SwitchUserSubscriber:
        tags:
            - { name: kernel.event_listener, event: security.switch_user, method: onSwitchUser }
